<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ClickGoBrr</title>

  <link rel="stylesheet" href="css/style.css">

  <script type="module" src="js/app.js"></script>
</head>

<body>

  <header class="site-header">
    <a class="logo" href="/">ClickGoBrr</a>
  </header>

  <main>
    <section class="typing-test">

      <div class="test-heading">
        <div>
          <p class="eyebrow">typing test</p>
          <h1>How fast can you type?</h1>
        </div>

        <div class="timer">
          <span id="time">30</span>
          <span id="timer-unit">seconds</span>
        </div>
      </div>

      <div class="test-options">
        <div class="mode-options">
          <button class="mode-button active" data-mode="time">Time</button>
          <button class="mode-button" data-mode="words">Words</button>
        </div>

        <div id="length-options" class="length-options"></div>
      </div>

      <div class="source-row">
        <span id="source">Walden — Henry David Thoreau</span>
        <button id="next-button" class="text-button">new text</button>
      </div>

      <div id="typing-area" class="typing-area" tabindex="0">
        <p id="prompt"></p>
      </div>

      <p id="status" class="hint">
        click the text and start typing
      </p>

      <div class="results">
        <p>
          <strong id="wpm">0</strong> WPM
        </p>

        <p>
          <strong id="accuracy">100</strong>% accuracy
        </p>
      </div>

      <button id="restart-button">Restart</button>

    </section>
  </main>

</body>
</html>
