<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ClickGoBrr</title>

  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/main.js"></script>
</head>

<body>

  <canvas id = "Background" class="background"></canvas>
  
  <header class="site-header">
    <a class="logo" href="/">ClickGoBrr</a>
    <button id="settings-button" class ="settings-button"> 
      settings
    </button>
  </header>

  <main>
    <section class="typing-test">

      <div class="test-live">

        <div class="test-options">
          <div class="mode-options">
            <button class="mode-button active" data-mode="time">Time</button>
            <button class="mode-button" data-mode="words">Words</button>
          </div>

          <div id="length-options" class="length-options"></div>
        </div>

        <div class="live-stats">
          <div class="timer">
            <strong id="time">30</strong>
            <span id="timer-unit">seconds</span>
          </div>

          <div>
            <strong id="wpm">0</strong>
            <span>wpm</span>
          </div>

          <div>
            <strong id="accuracy">100</strong>
            <span>accuracy</span>
          </div>
        </div>

        <div id="typing-area" class="typing-area" tabindex="0">
          <div class="prompt-viewport">
            <p id="prompt"></p>
            <span id="ghost-caret" class="ghost-caret"></span>
            <span id="caret" class="caret"></span>
          </div>
        </div>

        <div class="test-actions">
          <button id="restart-button" class="text-button">restart</button>
          <button id="next-button" class="text-button">new text</button>
        </div>

      </div>

      <section id="result" class="result" hidden>

        <div class="result-score">
          <span>wpm</span>
          <strong id="result-wpm">0</strong>
        </div>

        <div class="result-stats">
          <div>
            <span>accuracy</span>
            <strong id="result-accuracy">100%</strong>
          </div>

          <div>
            <span>time</span>
            <strong id="result-time">0s</strong>
          </div>

          <div>
            <span>personal best</span>
            <strong id="result-best">—</strong>
          </div>
        </div>

        <div class="result-actions">
          <button id="result-restart">run again</button>
          <button id="result-next">new text</button>
        </div>

      </section>

    </section>
  </main>

  <div id="settings-modal" class="settings-modal hidden">
    <div class="settings-panel">

      <div class="settings-header">
        <strong>Settings</strong>
        <button id="settings-close" class="settings-close">×</button>
      </div>

      <div class="setting">
        <div>
          <strong>Music</strong>
          <span>background soundtrack</span>
        </div>

        <input id="music-toggle" type="checkbox">
      </div>

      <div class="setting">
        <div>
          <strong>Ghost racer</strong>
          <span>race against your personal best</span>
        </div>

        <input id="ghost-toggle" type="checkbox" checked>
      </div>

      <div class="setting">
        <div>
          <strong>Background</strong>
          <span>animated stars and retro grid</span>
        </div>

        <input id="background-toggle" type="checkbox" checked>
      </div>

      <div class="setting volume-setting">
        <div>
          <strong>Music volume</strong>
          <span id="volume-label">30%</span>
        </div>

        <input
          id="music-volume" type="range" min="0" max="100" value="30">
      </div>
    </div>
  </div>

  <footer class = "shortcuts">
    <div class="footer-left">
      <span><kbd>tab</kbd> restart</span>
      <span><kbd>shift</kbd> + <kbd>enter</kbd> new text</span>
      <span><kbd>esc</kbd> focus</span>
    </div>

    <div class="footer-right">
      <a href="https://github.com/swaznil/clickgobrr" target="_blank">github</a>
    </div>
  </footer>

  <audio id="background-music" src="assets/retrowave-electronica.mp3" loop preload="metadata"></audio>
  
</body>
</html>
