<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ClickGoBrr</title>

  <link rel="stylesheet" href="css/style.css">

  <script type="module" src="js/app.js"></script>
</head>

<body>

  <header class="site-header">
    <a class="logo" href="/">ClickGoBrr</a>
  </header>

  <main>
    <section class="typing-test">

      <div class="test-heading">
        <div>
          <p class="eyebrow">typing test</p>
          <h1>How fast can you type?</h1>
        </div>

        <p class="timer">
          <span id="time">30</span>
          <span>seconds</span>
        </p>
      </div>

      <div class="source-row">
        <span id="source">Walden — Henry David Thoreau</span>

        <button id="next-button" class="text-button" type="button">
          new text
        </button>
      </div>

      <div
        id="typing-area"
        class="typing-area"
        tabindex="0"
        aria-label="Typing test"
      >
        <p id="prompt"></p>
      </div>

      <p class="hint">click the text and start typing</p>

      <div class="results">
        <p>
          <strong id="wpm">0</strong>
          WPM
        </p>

        <p>
          <strong id="accuracy">100</strong>%
          accuracy
        </p>
      </div>

      <button id="restart-button" type="button">
        Restart
      </button>

    </section>
  </main>

</body>
</html>
